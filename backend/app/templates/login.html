<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — EVE Industrial Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ static_url('css/style.css') }}" rel="stylesheet">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
            border: 1px solid var(--squad-card-border, #495057);
        }
        .login-header {
            text-align: center;
            padding: 24px 0 16px;
        }
        .login-header i {
            font-size: 3rem;
            color: #f0c040;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card bg-dark login-card">
            <div class="card-body p-4">
                <div class="login-header">
                    <i class="bi bi-boxes"></i>
                    <h4 class="mt-2">EVE Industrial Tool</h4>
                    <p class="text-secondary small mb-0">Blueprint Shopper & Corp Management</p>
                </div>

                <hr class="border-secondary">

                <p class="text-secondary small text-center">
                    Log in with your EVE Online account to access your blueprints, assets, and market data.
                </p>

                <a href="/auth/login" class="btn btn-primary btn-lg w-100 mb-3">
                    <i class="bi bi-person-plus"></i> Login with EVE SSO
                </a>

                <div id="loginError" class="alert alert-danger py-2 small d-none"></div>

                <p class="text-secondary small text-center mb-0 mt-3">
                    <i class="bi bi-shield-lock"></i>
                    Your data is linked to your EVE account. Only you can see your assets and blueprints.
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Show error from query params
        (function() {
            var params = new URLSearchParams(window.location.search);
            var err = params.get('error');
            if (err) {
                var el = document.getElementById('loginError');
                el.textContent = decodeURIComponent(err);
                el.classList.remove('d-none');
            }

            // If the visitor already has a valid session, send them straight in.
            // SECURITY: we never list characters here – an anonymous visitor must
            // not be able to see who is registered (that previously leaked names
            // of other users' characters via the global /auth/characters call).
            fetch('/auth/me', { credentials: 'include' })
                .then(function(r) {
                    if (r.ok) return r.json();
                    throw new Error('not logged in');
                })
                .then(function(char) {
                    if (char && char.character_id) {
                        // Already logged in — redirect to blueprint shopper
                        window.location.href = '/blueprints';
                    }
                })
                .catch(function() {
                    // Not logged in — only the SSO login button is shown.
                });
        })();
    </script>
</body>
</html>
